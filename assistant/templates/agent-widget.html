{% load static %}

{% block css %}

{% endblock css %}



{% block content %}
<button
  data-modal-open
  class="flex items-center justify-center cursor-pointer fixed right-5 bottom-5 rounded-full h-20 w-20 border border-gray-300 bg-gray-100 px-3 py-1.5 text-sm text-gray-900"
>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
    <path fill-rule="evenodd" d="M9 4.5a.75.75 0 0 1 .721.544l.813 2.846a3.75 3.75 0 0 0 2.576 2.576l2.846.813a.75.75 0 0 1 0 1.442l-2.846.813a3.75 3.75 0 0 0-2.576 2.576l-.813 2.846a.75.75 0 0 1-1.442 0l-.813-2.846a3.75 3.75 0 0 0-2.576-2.576l-2.846-.813a.75.75 0 0 1 0-1.442l2.846-.813A3.75 3.75 0 0 0 7.466 7.89l.813-2.846A.75.75 0 0 1 9 4.5ZM18 1.5a.75.75 0 0 1 .728.568l.258 1.036c.236.94.97 1.674 1.91 1.91l1.036.258a.75.75 0 0 1 0 1.456l-1.036.258c-.94.236-1.674.97-1.91 1.91l-.258 1.036a.75.75 0 0 1-1.456 0l-.258-1.036a2.625 2.625 0 0 0-1.91-1.91l-1.036-.258a.75.75 0 0 1 0-1.456l1.036-.258a2.625 2.625 0 0 0 1.91-1.91l.258-1.036A.75.75 0 0 1 18 1.5ZM16.5 15a.75.75 0 0 1 .712.513l.394 1.183c.15.447.5.799.948.948l1.183.395a.75.75 0 0 1 0 1.422l-1.183.395c-.447.15-.799.5-.948.948l-.395 1.183a.75.75 0 0 1-1.422 0l-.395-1.183a1.5 1.5 0 0 0-.948-.948l-1.183-.395a.75.75 0 0 1 0-1.422l1.183-.395c.447-.15.799-.5.948-.948l.395-1.183A.75.75 0 0 1 16.5 15Z" clip-rule="evenodd" />
    </svg>
</button>

<dialog
  closedby="any"
  aria-labelledby="modalTitle"
  aria-describedby="modalDescription"
  class="m-auto w-full h-full lg:w-9/12 lg:h-9/12 rounded-lg p-6 shadow-lg backdrop:bg-black/50"
>
    <div class="flex flex-col gap-4 h-full w-full bg-white">
    
        <div class="flex items-start justify-between h-1/12">
            <h2 id="modalTitle" class="text-xl font-bold text-gray-900 sm:text-2xl">Assistant</h2>

            <button
                type="button"
                data-modal-close
                class="-me-4 -mt-4 rounded-full p-2 text-gray-600 transition-colors hover:bg-gray-50 hover:text-gray-900 focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 focus:ring-offset-white focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2 focus-visible:ring-offset-white focus-visible:outline-none"
                aria-label="Close"
            >
                <svg
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                class="size-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                />
                </svg>
            </button>
        </div>

        <div id="message-history-container" class="h-8/12 flex flex-col gap-y-2 p-2 overflow-y-auto"></div>
        
        <div class="h-3/12 flex flex-col justify-end">
            <div>
                <label for="user_prompt">
                    <div class="relative mt-0.5 overflow-hidden rounded border border-gray-300 shadow-sm focus-within:ring focus-within:ring-blue-600">
                        <textarea
                            id="user_prompt"
                            class="w-full resize-y border-none focus:ring-0 sm:text-sm"
                            rows="4"
                        ></textarea>

                        <div class="flex items-center justify-end gap-2 p-1.5">
                            <button
                                type="button"
                                class="rounded border border-transparent px-3 py-1.5 text-sm font-medium text-gray-700 transition-colors hover:text-gray-900"
                                >
                                Clear
                            </button>

                            <button
                                type="button"
                                class="rounded border border-gray-300 px-3 py-1.5 text-sm font-medium text-gray-900 shadow-sm transition-colors hover:bg-gray-100"
                                >
                                Enter
                            </button>
                        </div>
                    </div>
                </label>
            </div>
        </div>
  
    </div>
</dialog>

{% endblock content %}

{% block js %}
    <script src="{% static "js-helpers/html-parse.js" %}"></script>
    <script src="{% static "agent-form.js" %}"></script>
{% endblock js %}
