{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="min-h-screen bg-[#D9CFC1] flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Sign In</h2>
    
    <form id="form-sign-in" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input 
          required
          id="email"
          type="email" 
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
          placeholder="your@email.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input 
          required
          id="password"
          type="password" 
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all"
          placeholder="••••••••"
        />
      </div>

      <button type="submit" class="w-full bg-[#43281C] text-white font-medium py-2.5 rounded-lg transition-colors">
        Sign In
      </button>
    </form>

  </div>
</div>

{% endblock content %}

{% block js %}
  <script src="{% static "sign-in.js" %}"></script>
{% endblock js %}
