{% extends "base.html" %}

{% block content %}
    <h1>Add recipe</h1>
    <div class="w-full h-full flex justify-center items-center">
        <div class="bg-gray-100 w-11/12 h-11/12 lg:w-7/12 lg:h-10/12 rounded-2xl p-4 flex flex-col justify-between">
            <form id="form-add-recipe" class="flex flex-col justify-between h-11/12 w-full">

                <label for="name">
                    <span class="text-lg font-medium text-gray-700"> Name </span>
                    <input
                        type="text"
                        id="name"
                        class="w-full p-2 rounded bg-white border-gray-300 shadow-sm text-lg"
                    />
                </label>

                <label for="type">
                    <span class="text-lg font-medium text-gray-700"> Type </span>
                    <select
                        name="type"
                        id="type"
                        class="w-full p-2 rounded bg-white border-gray-300 shadow-sm text-lg"
                    >
                        {% for choice in recipe_type_choices %}
                            <option value="{{ choice.0 }}">{{ choice.1 }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label for="description" class="h-1/3">
                    <span class="text-lg font-medium text-gray-700"> Description </span>

                    <textarea
                        id="description"
                        class="h-10/12 p-2 w-full resize-y rounded bg-white border-gray-300 shadow-sm sm:text-sm"
                    ></textarea>
                
                </label>

                <label for="directions" class="h-1/3">
                    <span class="text-lg font-medium text-gray-700"> Directions </span>

                    <textarea
                        id="directions"
                        class="h-10/12 p-2 resize-y w-full rounded bg-white border-gray-300 shadow-sm sm:text-sm"
                    ></textarea>
                
                </label>

                <label for="recipe_image">
                    <span class="text-lg font-medium text-gray-700"> Image </span>
                    <input
                        type="file"
                        name="recipe_image"
                        id="recipe_image"
                        class="w-full p-2 rounded bg-white border-gray-300 shadow-sm text-lg"
                    />
                </label>

            </form>
            <button 
                form="form-add-recipe" 
                type="submit"
                class="inline-flex cursor-pointer text-lg items-center justify-center rounded-full border border-[#43281C] bg-[#43281C] px-6 py-3 font-semibold text-white shadow-sm transition-colors hover:bg-[#331e15] focus-visible:ring-4 focus-visible:ring-indigo-200 focus-visible:outline-none"
            >
            Save
            </button>
        </div>
    </div>
{% endblock content %}


{% block js %}
    <script src="{% static "add-recipe.js" %}"></script>
{% endblock js %}
