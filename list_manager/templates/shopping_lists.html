{% extends "base.html" %}

{% block css %}

{% endblock css %}



{% block content %}

    <a href="/add-shopping-list">Add Shopping List</a>

    <h1>
        {{ page_title }}
    </h1>

    <div class="flex flex-wrap gap-4 p-8">
        {% for shopping_list in shopping_lists %}
    
            <a href="/shopping-list/{{ shopping_list.id }}" class="block rounded-lg p-4 shadow-lg bg-[#F7F9F9]">
                <svg class="h-56" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>

                <div class="mt-2">
                    <dl>
                    <div>
                        <dt class="sr-only">Recipe Name</dt> 
    
                        <dd class="font-medium">{{ shopping_list.name }}</dd>
                    </div>
                    </dl>
    
                    <div class="mt-6 flex items-center gap-8 text-xs">
                        <div class="sm:inline-flex sm:shrink-0 sm:items-center sm:gap-2">
                            <div class="mt-1.5 sm:mt-0">
                                <p class="text-gray-500">Recipes</p>
            
                                <p class="font-medium"></p>
                            </div>
                        </div>
        
                        <div class="sm:inline-flex sm:shrink-0 sm:items-center sm:gap-2">
                            <div class="mt-1.5 sm:mt-0">
                                <p class="text-gray-500">Ingredients</p>
            
                                <p class="font-medium"></p>
                            </div>
                        </div>

                    </div>
                </div>
            </a>
        
        {% endfor %}
    </div>

{% endblock content %}

{% block js %}

{% endblock js %}
